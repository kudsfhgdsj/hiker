# Entwurf. Läuft neben anderen Diensten auf einem geteilten Server: keine Ports 80/443,
# API und Web-Frontend sind nur über 127.0.0.1 erreichbar; der vorhandene Reverse Proxy
# leitet /api/ an die API und alles andere an das Web-Frontend.
# Konfiguration über .env (siehe .env.example).
name: hiker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiker}
      POSTGRES_USER: ${POSTGRES_USER:-hiker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 512m

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hiker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hiker}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL fehlt in .env}
      ENABLED_MODULES: ${ENABLED_MODULES:-auth,gear,nutrition,protocols,sync}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      STORAGE_PATH: /data/files
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: 1.0
    mem_limit: 512m

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:?WEB_SECRET_KEY fehlt in .env}
      API_BASE_URL: http://api:8000
      WEB_SESSION_DIR: /data/sessions
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-true}
      WEB_SESSION_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      # Leer = Standard (OpenStreetMap).
      MAP_TILE_URL: ${MAP_TILE_URL:-}
    volumes:
      - web-sessions:/data/sessions
    ports:
      - "127.0.0.1:${WEB_PORT:-8011}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m

volumes:
  db-data:
  files:
  web-sessions:
