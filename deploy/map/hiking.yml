# Zusatz-Ebene der eigenen Karte: Wege mit ihrer Schwierigkeit.
# Das OpenMapTiles-Schema kennt die SAC-Wanderskala und Klettersteige nicht; diese Ebene
# trägt sie nach. deploy/build-map.sh baut sie mit Planetiler und fügt sie in die Karte ein.
schema_name: hiker hiking paths
schema_description: Paths with their difficulty on the SAC hiking scale, and via ferratas
attribution: © OpenStreetMap contributors
args:
  area:
    description: Geofabrik area, e.g. switzerland
    default: switzerland
sources:
  osm:
    type: osm
    url: '${ "geofabrik:" + args.area }'
    local_path: '${ "/data/build/sources/" + args.area + ".osm.pbf" }'
layers:
  - id: hiking
    features:
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          sac_scale:
            - hiking
            - mountain_hiking
            - demanding_mountain_hiking
            - alpine_hiking
            - demanding_alpine_hiking
            - difficult_alpine_hiking
          # Klettersteige und Leitern: eigene Wegstücke (highway=ladder) oder ein normaler
          # Weg, auf dem eine Leiter liegt (ladder=yes).
          highway:
            - via_ferrata
            - ladder
          ladder: 'yes'
        attributes:
          - key: sac_scale
            tag_value: sac_scale
          - key: highway
            tag_value: highway
          - key: ladder
            tag_value: ladder
          - key: name
            tag_value: name
            min_zoom: 14
      # Leitern, die in OpenStreetMap als einzelner Punkt auf dem Weg eingetragen sind.
      - source: osm
        geometry: point
        min_zoom: 14
        include_when:
          highway: ladder
          ladder: 'yes'
        attributes:
          - key: highway
            tag_value: highway
          - key: ladder
            tag_value: ladder
