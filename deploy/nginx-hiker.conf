# Beispiel für nginx als Reverse Proxy vor hiker.
# Ablegen als /etc/nginx/conf.d/hiker.conf (http-Kontext), Domain und Zertifikat anpassen,
# dann: nginx -t && systemctl reload nginx
#
# /api/ geht an die API (API_PORT), alles andere an das Web-Frontend (WEB_PORT).

# Tokens öffentlicher Links sind Geheimnisse und dürfen nicht ins Log.
map $request_uri $hiker_log_uri {
    ~^(?<hiker_pre>/p/)[^/?]+(?<hiker_post>.*)$                    "${hiker_pre}[redacted]${hiker_post}";
    ~^(?<hiker_pre>/api/v1/public/tours/)[^/?]+(?<hiker_post>.*)$  "${hiker_pre}[redacted]${hiker_post}";
    default                                                        $request_uri;
}

# Ohne Referer: die Unterseiten eines öffentlichen Links tragen das Token im Referer.
log_format hiker '$remote_addr - [$time_local] "$request_method $hiker_log_uri $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name hiker.lacasa.internal;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hiker.lacasa.internal;

    # Zertifikat: bei einer öffentlichen Domain von Let's Encrypt (certbot), bei einer
    # internen Domain wie *.internal von der eigenen Zertifizierungsstelle.
    ssl_certificate     /etc/ssl/hiker/fullchain.pem;
    ssl_certificate_key /etc/ssl/hiker/privkey.pem;

    access_log /var/log/nginx/hiker.access.log hiker;
    error_log  /var/log/nginx/hiker.error.log;

    # Mehrere Fotos in einem Upload (MAX_UPLOAD_MB je Datei).
    client_max_body_size 320m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Genau eine Adresse: danach zählt das Rate-Limit der API.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_read_timeout 120s;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
    }
}
