<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>hiker 3D</title>
  <link rel="stylesheet" href="maplibre-gl.css">
  <style>
    html, body, #map { height: 100%; margin: 0; background: #e4e9e6; }
    #note { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font: 16px sans-serif; color: #444; padding: 0 24px; }
    #radar { position: absolute; left: 10px; right: 56px; top: 10px; display: flex; align-items: center; gap: 10px;
      padding: 6px 14px 6px 6px; border-radius: 22px; background: #fff; font: 14px sans-serif; color: #222;
      box-shadow: 0 0 0 2px #0002; }
    #radar[hidden] { display: none; }
    #radar input { flex: 1; min-width: 0; }
    #play { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #e6efe8; font-size: 15px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #c62828; border: 2px solid #fff; box-shadow: 0 0 3px #0008; }
    .dot.found { background: #1565c0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="note" hidden></div>
  <div id="radar" hidden>
    <button id="play" type="button" aria-label="Zeitverlauf abspielen">▶</button>
    <input id="time" type="range" min="0" step="1" aria-label="Zeitpunkt">
    <span id="clock"></span>
  </div>
  <script src="maplibre-gl-csp.js"></script>
  <script src="view.js"></script>
</body>
</html>
