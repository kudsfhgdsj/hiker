[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hiker-web"
version = "0.1.0"
description = "hiker web frontend (Flask), a client of the hiker REST API"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",       # BSD-3 – server-rendered pages
    "httpx2>=2.13",     # BSD-3 – HTTP client for the hiker API
    "gunicorn>=23",     # MIT – WSGI server in the container
    "segno>=1.6",       # BSD-3 – QR code for setting up the second factor, no dependencies
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["hiker_web*"]

[tool.setuptools.package-data]
hiker_web = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
