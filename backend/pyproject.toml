[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hiker-backend"
version = "0.1.0"
description = "hiker API (FastAPI + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",           # MIT – web framework, OpenAPI
    "uvicorn>=0.30",            # BSD-3 – ASGI server
    "sqlalchemy>=2.0",          # MIT – ORM
    "alembic>=1.16",            # MIT – migrations
    "psycopg[binary]>=3.2",     # LGPL-3 – PostgreSQL driver
    "pydantic-settings>=2.4",   # MIT – configuration from environment
    "argon2-cffi>=23.1",        # MIT – password hashing
    "pyjwt>=2.9",               # MIT – access tokens
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.13",             # BSD-3 – required by FastAPI's TestClient
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
