[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Core tables live in migrations/versions (branch label "core").
# Every module keeps its own migrations (own branch, label = module name).
# Add the path of a new module here, separated by the OS path separator (":").
# Apply with: alembic upgrade heads
version_locations = %(here)s/migrations/versions:%(here)s/app/modules/auth/migrations:%(here)s/app/modules/gear/migrations:%(here)s/app/modules/nutrition/migrations:%(here)s/app/modules/protocols/migrations:%(here)s/app/modules/planning/migrations

# The database URL comes from the environment (DATABASE_URL), see migrations/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
